<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Touch Gestures</title>
		<link rel="stylesheet" href="./style.css" />
	</head>

	<body>
		<script
			async
			src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"
		></script>
		<script type="importmap">
			{
				"imports": {
					"three": "https://unpkg.com/three@0.162.0/build/three.module.js",
					"three/addons/": "https://unpkg.com/three@0.162.0/examples/jsm/"
				}
			}
		</script>
		<script type="module">
			import * as THREE from "three";

			import { ARButton } from "three/addons/webxr/ARButton.js";

			let camera, scene, renderer;
			let controller;
			let mesh;

			init();
			animate();

			function init() {
				const container = document.createElement("div");
				document.body.appendChild(container);

				scene = new THREE.Scene();

				camera = new THREE.PerspectiveCamera(
					70,
					window.innerWidth / window.innerHeight,
					0.01,
					40
				);

				renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
				renderer.setPixelRatio(window.devicePixelRatio);
				renderer.setSize(window.innerWidth, window.innerHeight);
				renderer.xr.enabled = true;
				container.appendChild(renderer.domElement);

				var light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
				light.position.set(0.5, 1, 0.25);
				scene.add(light);

				controller = renderer.xr.getController(0);
				controller.addEventListener("select", onSelect);
				scene.add(controller);

				document.body.appendChild(ARButton.createButton(renderer));

				window.addEventListener("resize", onWindowResize, false);
			}

			// this example is borrowed with slight modifications from three.js samples
			// https://threejs.org/examples/?q=webxr#webxr_ar_cones
			function onSelect() {
				const geometry = new THREE.ConeGeometry(0.1, 0.2, 32).rotateX(
					Math.PI / 2
				);
				const material = new THREE.MeshPhongMaterial({
					color: 0xffffff * Math.random(),
					shininess: 6,
					flatShading: true,
					transparent: 1,
					opacity: 0.8,
				});
				mesh = new THREE.Mesh(geometry, material);

				mesh.position.set(0, 0, -0.3).applyMatrix4(controller.matrixWorld);
				mesh.quaternion.setFromRotationMatrix(controller.matrixWorld);

				scene.add(mesh);
			}

			function onWindowResize() {
				camera.aspect = window.innerWidth / window.innerHeight;
				camera.updateProjectionMatrix();

				renderer.setSize(window.innerWidth, window.innerHeight);
			}

			function animate() {
				renderer.setAnimationLoop(render);
			}

			function render() {
				renderer.render(scene, camera);
			}
		</script>
	</body>
</html>
